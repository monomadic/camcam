[package]
name = "camcam"
version = "0.1.0"
edition = "2024"
description = "A hardware-decoded live camera wall"

[dependencies]
anyhow = "1"
base64 = "0.22"
bytemuck = { version = "1", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
curl = "0.4"
eframe = { version = "0.36.2", default-features = false, features = ["wgpu_no_default_features", "default_fonts", "accesskit"] }
egui-wgpu = { version = "0.36.2", default-features = false }
libc = "0.2"
ffmpeg-sys-next = { version = "8", default-features = false, features = ["avcodec", "avformat"] }
rand = "0.9"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
sha1 = "0.10"
socket2 = "0.6"
tempfile = "3"
toml_edit = "0.22"
toml = "0.8"
url = "2"
wgpu = { version = "30", default-features = false, features = ["std", "metal", "wgsl"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
objc2 = "0.6"
objc2-metal = { version = "0.3.2", default-features = false, features = ["std", "MTLDevice", "MTLTexture"] }

[dev-dependencies]
pollster = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
